<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 116" role="img" aria-label="ELETTRO">

  <!-- ── Circular connector emblem ── -->

  <!-- Dark interior fill -->
  <circle cx="58" cy="58" r="50" fill="#111111"/>

  <!-- Gold outer ring -->
  <circle cx="58" cy="58" r="50" stroke="#D4920A" stroke-width="7" fill="none"/>

  <!-- Inner ring accent (subtle separator) -->
  <circle cx="58" cy="58" r="41" stroke="#D4920A" stroke-width="1.5" fill="none" opacity="0.35"/>

  <!-- 4 parallel cable lines (silver/gray), left portion of circle -->
  <line x1="12" y1="43" x2="66" y2="43" stroke="#9AA0A8" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="12" y1="52" x2="66" y2="52" stroke="#9AA0A8" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="12" y1="61" x2="66" y2="61" stroke="#9AA0A8" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="12" y1="70" x2="66" y2="70" stroke="#9AA0A8" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Gold right-pointing chevron (connector arrow) -->
  <polyline points="62,37 90,58 62,79"
            stroke="#D4920A" stroke-width="9"
            stroke-linecap="round" stroke-linejoin="round"
            fill="none"/>

  <!-- ── Wordmark ── -->
  <!-- "EL" in dark, "ETTRO" in gold — both heavy weight -->
  <text x="130" y="82"
        font-family="'Arial Black', 'Impact', 'Helvetica Neue', Arial, sans-serif"
        font-weight="900"
        font-size="68"
        letter-spacing="-1">
    <tspan fill="#FFFFFF">EL</tspan><tspan fill="#D4920A">ETTRO</tspan>
  </text>

  <!-- ® superscript -->
  <text x="506" y="26"
        font-family="Arial, Helvetica, sans-serif"
        font-size="19"
        fill="#AAAAAA">®</text>

  <!-- Gold underline bar -->
  <rect x="130" y="90" width="384" height="4" fill="#D4920A" rx="2"/>

  <!-- Tagline -->
  <text x="130" y="110"
        font-family="Arial, Helvetica, sans-serif"
        font-size="12.5"
        fill="#AAAAAA"
        font-style="italic"
        letter-spacing="0.2">Strong Connections, Stronger Performance....</text>

</svg>
