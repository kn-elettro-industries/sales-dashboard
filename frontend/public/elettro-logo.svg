<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 108" role="img" aria-label="KN Elettro Industries">

  <!-- ── Circular connector emblem ── -->
  <circle cx="54" cy="54" r="50" stroke="#D4920A" stroke-width="5" fill="white"/>

  <!-- 4 parallel cable lines inside circle -->
  <g stroke="#1C1C1C" stroke-width="5" stroke-linecap="round">
    <line x1="10" y1="38" x2="70" y2="38"/>
    <line x1="10" y1="50" x2="70" y2="50"/>
    <line x1="10" y1="62" x2="70" y2="62"/>
    <line x1="10" y1="74" x2="70" y2="74"/>
  </g>

  <!-- Gold right-pointing chevron (connector arrow) -->
  <polyline points="62,34 86,54 62,74"
            stroke="#D4920A" stroke-width="9"
            stroke-linecap="round" stroke-linejoin="round"
            fill="none"/>

  <!-- ── ELETTRO wordmark: EL black, ETTRO gold ── -->
  <text x="118" y="76"
        font-family="'Arial Black','Impact','Helvetica Neue',Arial,sans-serif"
        font-weight="900"
        font-size="62">
    <tspan fill="#1C1C1C">EL</tspan><tspan fill="#D4920A">ETTRO</tspan>
  </text>

  <!-- ® superscript -->
  <text x="418" y="28"
        font-family="Arial,Helvetica,sans-serif"
        font-size="18"
        fill="#666666">®</text>

  <!-- Gold underline -->
  <rect x="118" y="81" width="302" height="3.5" fill="#D4920A" rx="1"/>

  <!-- Tagline -->
  <text x="118" y="100"
        font-family="Arial,Helvetica,sans-serif"
        font-size="12"
        fill="#555555"
        font-style="italic">Strong Connections, Stronger Performance....</text>

</svg>
